name: Application CI

on: [push, pull_request]

jobs:
  pipeline:
    name: coopfull pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40

    env:
      NODE_VERSION: 24.18.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true
      
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node.js packages
        run: npm install

      - name: Run backend test
        run: |
          chmod +x mvnw
          npm run ci:backend:test

      - name: Run frontend test
        run: npm run ci:frontend:test

      - name: Package application
        run: npm run java:jar:prod

      # - name: Build and publish docker image
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      #   run: |
      #     GIT_TAG=:${GITHUB_REF#refs/tags/}
      #     DOCKER_TAG=${GIT_TAG#:refs/heads/main}
      #     ./mvnw -ntp jib:build \
      #       -Djib.to.image=jhipster/coopfull${DOCKER_TAG} \
      #       -Djib.to.auth.username="${{ secrets.DOCKER_USERNAME }}" \
      #       -Djib.to.auth.password="${{ secrets.DOCKER_PASSWORD }}" \
      #       -Pprod
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and publish GHCR Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMAGE_TAG="latest"
          fi

          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          echo "Building and publishing: ${IMAGE}:${IMAGE_TAG}"

          ./mvnw -ntp jib:build \
            -Djib.to.image="${IMAGE}:${IMAGE_TAG}" \
            -Djib.to.auth.username="${USERNAME}" \
            -Djib.to.auth.password="${PASSWORD}" \
            -Pprod

      - name: 'E2E: Package'
        run: npm run ci:e2e:package

      - name: 'E2E: Prepare'
        run: npm run ci:e2e:prepare

      - name: 'E2E: Run'
        run: npm run ci:e2e:run
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: 'E2E: Teardown'
        run: npm run ci:e2e:teardown
        
deploy:
    name: Deploy to private VPS
    runs-on: ubuntu-latest
    needs: pipeline

    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:

      - name: Deploy Docker image to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "Deploying coopfull"
            echo "======================================"

            IMAGE="ghcr.io/nalinedev/enrollment:latest"
            CONTAINER="coopfull"

            echo "Pulling Docker image..."
            docker pull "$IMAGE"

            echo "Stopping existing container..."
            docker stop "$CONTAINER" 2>/dev/null || true

            echo "Removing existing container..."
            docker rm "$CONTAINER" 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"

            docker ps --filter "name=$CONTAINER"