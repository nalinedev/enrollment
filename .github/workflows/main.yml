name: Application CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: coopfull pipeline
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40

    env:
      NODE_VERSION: 24.18.0
      SPRING_OUTPUT_ANSI_ENABLED: DETECT
      SPRING_JPA_SHOW_SQL: false
      JHI_DISABLE_WEBPACK_LOGS: true

    permissions:
      contents: read
      packages: write

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # ============================================================
      # Node.js
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}


      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # Install dependencies
      # ============================================================

      - name: Install Node.js packages
        run: npm install


      # ============================================================
      # Backend tests
      # ============================================================

      - name: Run backend test
        run: |
          chmod +x mvnw
          npm run ci:backend:test


      # ============================================================
      # Frontend tests
      # ============================================================

      - name: Run frontend test
        run: npm run ci:frontend:test


      # ============================================================
      # Package application
      # ============================================================

      - name: Package application
        run: npm run java:jar:prod


      # ============================================================
      # Login to GitHub Container Registry
      # ============================================================

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin


      # ============================================================
      # Build and publish Docker image to GHCR
      # ============================================================

      - name: Build and publish GHCR Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          USERNAME: ${{ github.actor }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMAGE_TAG="latest"
          fi

          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          echo "======================================"
          echo "Building Docker image"
          echo "======================================"
          echo "Image: ${IMAGE}:${IMAGE_TAG}"

          ./mvnw -ntp jib:build \
            -Djib.to.image="${IMAGE}:${IMAGE_TAG}" \
            -Djib.to.auth.username="${USERNAME}" \
            -Djib.to.auth.password="${PASSWORD}" \
            -Pprod


      # ============================================================
      # E2E tests
      # ============================================================

      - name: 'E2E: Package'
        run: npm run ci:e2e:package

      - name: 'E2E: Prepare'
        run: npm run ci:e2e:prepare

      - name: 'E2E: Run'
        run: npm run ci:e2e:run
        env:
          CYPRESS_ENABLE_RECORD: false
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: 'E2E: Teardown'
        run: npm run ci:e2e:teardown


      # ============================================================
      # Copy Docker Compose file to VPS
      # ============================================================

      - name: Copy Docker Compose file to VPS
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_NALINE_IP }}
          username: ${{ secrets.VPS_NALINE_USER }}
          key: ${{ secrets.SSH_NALINE_PRIVATE_KEY }}
          port: ${{ secrets.VPS_NALINE_SSH_PORT }}
          source: docker-compose.yml
          target: /opt/naline/coopfull


      # ============================================================
      # Deploy application to VPS
      # ============================================================

      - name: Deploy application to VPS
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          host: ${{ secrets.VPS_NALINE_IP }}
          username: ${{ secrets.VPS_NALINE_USER }}
          key: ${{ secrets.SSH_NALINE_PRIVATE_KEY }}
          port: ${{ secrets.VPS_NALINE_SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -e
            
            export DOCKER_CONFIG="$HOME/.docker"
            #export DOCKER_CONFIG="$HOME/.docker-ghcr"
            #export DOCKER_CONFIG=/home/naline/.docker
            #export DOCKER_CONFIG=/home/naline/.docker

            mkdir -p "$DOCKER_CONFIG"

            APP_DIR="/opt/naline/coopfull"

            echo "======================================"
            echo "Deploying CoopFull"
            echo "======================================"

            cd "$APP_DIR"

            echo "Logging into GitHub Container Registry..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            #echo "Pulling latest CoopFull image..."

            #docker compose pull coopfull
            
            echo "Pulling latest Compose image..."
            docker compose pull
            
            echo "Starting application..."
            
            docker compose up -d --force-recreate

            #echo "Starting application..."

            #docker compose up -d --remove-orphans

            echo "Waiting for application..."

            sleep 10

            echo "======================================"
            echo "Container status"
            echo "======================================"

            docker compose ps

            echo "======================================"
            echo "Application health"
            echo "======================================"

            docker inspect \
              --format='{{.State.Health.Status}}' \
              coopfull || true

            echo "======================================"
            echo "Recent application logs"
            echo "======================================"

            docker compose logs --tail=100 coopfull

            echo "======================================"
            echo "Cleaning unused Docker images"
            echo "======================================"

            docker image prune -f
            
            echo "Logging out from GHCR..." 
            
            docker logout ghcr.io

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"